<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>SAUAP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&amp;family=Outfit:wght@700&amp;display=swap" rel="stylesheet" />
    <link href="resources/style.css" rel="stylesheet" type="text/css"/>
</h:head>

<h:body>
    <h:form id="mainForm">
        <p:growl id="messages" showDetail="true" />

        <div class="app">
            <aside class="sidebar">
                <div class="brand">
                    <div class="logo">
                        <span class="logo-text">SAUAP</span>
                    </div>
                    <nav class="nav" aria-label="Principal">
                        <a class="nav-item nav-item--active" href="#" data-target="profesores">
                                <span class="icon-box icon-box--20">
                                    <p:graphicImage url="resources/myspace.png" alt="" width="20" height="20" />
                                </span>
                            <span>Profesores</span>
                        </a>
                        <a class="nav-item" href="#" data-target="asignaturas">
                                <span class="icon-box icon-box--20">
                                    <p:graphicImage url="resources/file-text.svg" alt="" width="20" height="20" />
                                </span>
                            <span>Asignaturas</span>
                        </a>
                        <a class="nav-item" href="#" data-target="asignacion">
                                <span class="icon-box icon-box--20">
                                    <p:graphicImage url="resources/folder-open.svg" alt="" width="20" height="20" />
                                </span>
                            <span>Asignación</span>
                        </a>
                    </nav>
                </div>
                <div class="sidebar-footer">
                    <p:graphicImage styleClass="footer-line" url="resources/line.svg" alt="" />
                    <p:commandButton id="Sigt-outBttn" styleClass="sign-out" type="button" actionListener="#{usuarioBean.signOut()}" value="Cerrar Sesión" icon="pi pi-sign-out" />
                </div>
            </aside>

            <!-- Profesores -->
            <main class="main view-panel active" id="view-profesores">
                <header class="header">
                    <div class="header-titles">
                        <h1>Profesores</h1>
                        <p>Registro, Consulta y Modificación de los profesores.</p>
                    </div>
                    <p:commandButton id="btn-open-profesor" value="Registrar Profesor" styleClass="register-btn" process="@this" actionListener="#{profesorBean.limpiarFormulario}" update=":mainForm:dialogoProfesorForm :mainForm:dlgHeader" oncomplete="PF('dlgProfesor').show();" icon="pi pi-plus" />
                </header>
                <section class="body" aria-label="Contenido">
                    <h2 style="padding: 0px 0px 10px;">Profesores Registrados</h2>
                    <p:dataTable id="dtProfesores" value="#{profesorBean.listaProfesores}" var="prof" selectionMode="single" selection="#{profesorBean.profesor}" rowKey="#{prof.idProfesor}" responsiveLayout="scroll" emptyMessage="No hay profesores registrados actualmente.">

                        <p:ajax event="rowDblselect" listener="#{profesorBean.onRowSelect}" update=":mainForm:dialogoProfesorForm :mainForm:dlgHeader" oncomplete="PF('dlgProfesor').show();" />

                        <p:column headerText="ID">
                            <h:outputText value="#{prof.idProfesor}" />
                        </p:column>
                        <p:column headerText="Nombre">
                            <h:outputText value="#{prof.nombre}" />
                        </p:column>
                        <p:column headerText="Apellido Paterno">
                            <h:outputText value="#{prof.apellidoPaterno}" />
                        </p:column>
                        <p:column headerText="Apellido Materno">
                            <h:outputText value="#{prof.apellidoMaterno}" />
                        </p:column>
                        <p:column headerText="RFC">
                            <h:outputText value="#{prof.rfc}" />
                        </p:column>
                    </p:dataTable>
                </section>
            </main>

            <!-- Asignaturas -->
            <main class="main view-panel" id="view-asignaturas">
                <header class="header">
                    <div class="header-titles">
                        <h1>Asignaturas</h1>
                        <p>Registro, Consulta y Modificación de las Asignaturas.</p>
                    </div>
                    <p:commandButton id="btn-open-asignatura" value="Registrar Asignatura" styleClass="register-btn" process="@this" actionListener="#{asignaturaBean.limpiarFormulario}" update=":mainForm:dialogoAsignaturaForm :mainForm:dlgAsignaturaHeader" oncomplete="PF('dlgAsignatura').show();" icon="pi pi-plus" />
                </header>
                <section class="body" aria-label="Contenido">
                    <h2 style="padding: 0px 0px 10px;">Asignaturas Registradas</h2>
                    <p:dataTable id="dtAsignaturas" value="#{asignaturaBean.listaAsignaturas}" var="asig" selectionMode="single" selection="#{asignaturaBean.asignatura}" rowKey="#{asig.idAsignatura}" responsiveLayout="scroll" emptyMessage="No hay asignaturas registradas actualmente.">

                        <p:ajax event="rowDblselect" listener="#{asignaturaBean.onRowSelect}" update=":mainForm:dialogoAsignaturaForm :mainForm:dlgAsignaturaHeader" oncomplete="PF('dlgAsignatura').show();" />

                        <p:column headerText="ID">
                            <h:outputText value="#{asig.idAsignatura}" />
                        </p:column>
                        <p:column headerText="Nombre">
                            <h:outputText value="#{asig.nombre}" />
                        </p:column>
                        <p:column headerText="Horas Clase">
                            <h:outputText value="#{asig.horasClase}" />
                        </p:column>
                        <p:column headerText="Horas Taller">
                            <h:outputText value="#{asig.horasTaller}" />
                        </p:column>
                        <p:column headerText="Horas Laboratorio">
                            <h:outputText value="#{asig.horasLab}" />
                        </p:column>
                    </p:dataTable>
                </section>
            </main>

            <!-- Asignación
            <main class="main view-panel" id="view-asignacion">
                <header class="header">
                    <div class="header-titles">
                        <h1>Asignación</h1>
                        <p>Asignación de asignaturas a profesores.</p>
                    </div>
                    <p:commandButton id="btn-open-asignacion" styleClass="register-btn" type="button" onclick="PF('dlgAsignacion').show();">
                            <span class="icon-box icon-box-16">
                                <p:graphicImage url="resources+/plus.svg" alt="" width="16" height="16" />
                            </span>
                        <span>Nueva Asignación</span>
                    </p:commandButton>
                </header>
                <section class="body" aria-label="Contenido">
                     Cargar tabla de Asignaciones
                </section>
            </main> -->
        </div>

        <!-- Registro Profesor -->
        <p:dialog widgetVar="dlgProfesor" modal="false" draggable="true" resizable="false" width="580px" styleClass="custom-dialog">

            <f:facet name="header">
                <h:outputText id="dlgHeader" value="#{profesorBean.profesor != null and profesorBean.profesor.idProfesor != null ? 'Editar / Consultar Profesor' : 'Registrar Profesor'}" />
            </f:facet>

            <h:panelGroup id="dialogoProfesorForm">
                <div class="modal-body">
                    <div class="form-group">
                        <p:outputLabel for="prof-nombre" value="Nombre:" />
                        <p:inputText id="prof-nombre" value="#{profesorBean.profesor.nombre}" styleClass="custom-input" />
                    </div>
                    <div class="form-group">
                        <p:outputLabel for="prof-paterno" value="Apellido Paterno:" />
                        <p:inputText id="prof-paterno" value="#{profesorBean.profesor.apellidoPaterno}" styleClass="custom-input" />
                    </div>
                    <div class="form-group">
                        <p:outputLabel for="prof-materno" value="Apellido Materno:" />
                        <p:inputText id="prof-materno" value="#{profesorBean.profesor.apellidoMaterno}" styleClass="custom-input" />
                    </div>
                    <div class="form-group">
                        <p:outputLabel for="prof-rfc" value="RFC:" />
                        <p:inputText id="prof-rfc" value="#{profesorBean.profesor.rfc}" styleClass="custom-input" />
                    </div>
                    <div class="modal-footer" style="display: flex; gap: 10px; justify-content: flex-end;">
                        <p:commandButton value="Registrar" styleClass="modal-submit-btn" actionListener="#{profesorBean.guardarProfesor()}" update=":mainForm:dtProfesores dialogoProfesorForm messages" rendered="#{profesorBean.profesor.idProfesor == null}" oncomplete="if (args &amp;&amp; args.isSaved) { PF('dlgProfesor').hide(); }" />

                        <p:commandButton value="Actualizar" styleClass="modal-submit-btn" actionListener="#{profesorBean.actualizarProfesor()}" update=":mainForm:dtProfesores dialogoProfesorForm messages" rendered="#{profesorBean.profesor.idProfesor != null}" oncomplete="if (args &amp;&amp; args.isSaved) { PF('dlgProfesor').hide(); }" />

                        <p:commandButton value="Eliminar" styleClass="ui-button-danger modal-submit-btn" actionListener="#{profesorBean.eliminarProfesor()}" update=":mainForm:dtProfesores dialogoProfesorForm messages" rendered="#{profesorBean.profesor.idProfesor != null}" oncomplete="if (args &amp;&amp; args.isSaved) { PF('dlgProfesor').hide(); }">
                            <p:confirm header="Confirmación" message="¿Estás seguro de eliminar este profesor?" icon="pi pi-alert" />
                        </p:commandButton>
                    </div>
                </div>
            </h:panelGroup>
        </p:dialog>

        <!-- Registro / Edición Asignatura -->
        <p:dialog widgetVar="dlgAsignatura" modal="false" draggable="true" resizable="false" width="580px" styleClass="custom-dialog">

            <f:facet name="header">
                <h:outputText id="dlgAsignaturaHeader" value="#{asignaturaBean.asignatura != null and asignaturaBean.asignatura.idAsignatura != null ? 'Editar / Consultar Asignatura' : 'Registrar Asignatura'}" />
            </f:facet>

            <h:panelGroup id="dialogoAsignaturaForm">
                <div class="modal-body">
                    <div class="form-group">
                        <p:outputLabel for="asig-nombre" value="Nombre:" />
                        <p:inputText id="asig-nombre" value="#{asignaturaBean.asignatura.nombre}" styleClass="custom-input" />
                    </div>
                    <div class="form-group">
                        <p:outputLabel for="asig-clase" value="Horas Clase:" />
                        <p:spinner id="asig-clase" value="#{asignaturaBean.asignatura.horasClase}" min="0" styleClass="custom-input" />
                    </div>
                    <div class="form-group">
                        <p:outputLabel for="asig-taller" value="Horas Taller:" />
                        <p:spinner id="asig-taller" value="#{asignaturaBean.asignatura.horasTaller}" min="0" styleClass="custom-input" />
                    </div>
                    <div class="form-group">
                        <p:outputLabel for="asig-lab" value="Horas Laboratorio:" />
                        <p:spinner id="asig-lab" value="#{asignaturaBean.asignatura.horasLab}" min="0" styleClass="custom-input" />
                    </div>

                    <div class="modal-footer" style="display: flex; gap: 10px; justify-content: flex-end;">
                        <p:commandButton value="Registrar" styleClass="modal-submit-btn" actionListener="#{asignaturaBean.guardarAsignatura()}" update=":mainForm:dtAsignaturas dialogoAsignaturaForm messages" rendered="#{asignaturaBean.asignatura.idAsignatura == null}" oncomplete="if (args &amp;&amp; args.isSaved) { PF('dlgAsignatura').hide(); }" />

                        <p:commandButton value="Actualizar" styleClass="modal-submit-btn" actionListener="#{asignaturaBean.actualizarAsignatura()}" update=":mainForm:dtAsignaturas dialogoAsignaturaForm messages" rendered="#{asignaturaBean.asignatura.idAsignatura != null}" oncomplete="if (args &amp;&amp; args.isSaved) { PF('dlgAsignatura').hide(); }" />

                        <p:commandButton value="Eliminar" styleClass="ui-button-danger modal-submit-btn" actionListener="#{asignaturaBean.eliminarAsignatura()}" update=":mainForm:dtAsignaturas dialogoAsignaturaForm messages" rendered="#{asignaturaBean.asignatura.idAsignatura != null}" oncomplete="if (args &amp;&amp; args.isSaved) { PF('dlgAsignatura').hide(); }">
                            <p:confirm header="Confirmación" message="¿Estás seguro de eliminar esta asignatura?" icon="pi pi-alert" />
                        </p:commandButton>
                    </div>
                </div>
            </h:panelGroup>
        </p:dialog>

                        <f:selectItem itemLabel="Asignar" itemValue="" noSelectionOption="true" />
                         Cargar lista de profesores
                        <f:selectItems value="#{asignacionBean.listaProfesoresOptions}" />

                </div>

                        Cargar lista de asignaturas

                </div>

        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
            <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
            <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes" />
        </p:confirmDialog>

    </h:form>



    <script type="text/javascript" src="app.js"></script>
</h:body>
</html>
