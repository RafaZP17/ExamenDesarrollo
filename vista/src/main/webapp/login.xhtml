<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">

<h:head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css?family=Outfit:700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=DM+Sans:400,500,600,700&amp;display=swap" rel="stylesheet" />
    <link href="resources/main.css" rel="stylesheet" type="text/css" />
    <title>SAUAP · Portal de Acceso</title>
</h:head>

<h:body>
    <div class="page">
        <div class="header">
            <span class="title">PORTAL DE ACCESO</span>
        </div>

        <div class="main">
            <div class="decor decor--1" style="top: -105px; left: -220px;"></div>
            <div class="decor decor--2" style="top: 30px; left: -204px;"></div>
            <div class="decor decor--6" style="width: 290px; height: 170px; bottom: -52px; left: 88px; background: rgba(78, 189, 124, 0.32);"></div>
            <div class="decor decor--3" style="top: -225px; right: -110px; width: 300px; height: 450px;"></div>
            <div class="decor decor--11" style="bottom: -130px;left: -201px;width: 500px;height: 220px;background: rgba(2, 126, 54, 0.67);"></div>
            <div class="decor decor--4" style="bottom: -350px; right: -250px;"></div>
            <div class="decor decor--7" style="bottom: -320px;left: 288px;background: rgb(29 104 83);"></div>
            <div class="decor decor--7" style="bottom: -85px;left: -260px;background: rgb(29 104 83);"></div>
            <div class="decor decor--7" style="bottom: -356px;left: 30px;background: rgb(29 104 83);"></div>
            <div class="decor decor--8" style="width: 300px;height: 300px; bottom: 135px; left: -215px; background: transparent; border: 3px solid rgb(29 104 83);"></div>
            <div class="decor decor--5" style="bottom: 99px; left: -334px;"></div>
            <div class="decor decor--10" style="width: 287px; height: 153px; bottom: -80px; left: 83px; background: transparent; border: 3px solid rgb(0 114 63);"></div>

            <div class="brand">
                <p:graphicImage url="resources/v39_1384.png" styleClass="logo" alt="Logotipo SAUAP" />
                <div class="divider"></div>
                <div class="brand-text">
                    <h1>SAUAP</h1>
                    <p>Sistema de Asignación de Unidades de Aprendizaje a Profesores</p>
                </div>
            </div>

            <h:form id="loginForm">
                <p:messages id="messages" showDetail="true" closable="true" />

                <div class="login-card">
                    <div class="brand-pill">SAUAP</div>

                    <div class="field-group">
                        <div class="input-group">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <p:inputText id="usuario" placeholder="Usuario" autocomplete="off" value="#{loginUI.usuario.username}" required="true"
                                         style="background: transparent ; border: none; outline: none; box-shadow: none; width: 100%; color: #1f2937;" />
                        </div>

                        <div class="input-group">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <p:password id="password" placeholder="Contraseña" value="#{loginUI.usuario.password}" required="true"
                                        style="background: transparent; outline: none; box-shadow: none; width: 100%; color: #1f2937;" />
                        </div>
                    </div>

                    <p:commandButton ajax="false" styleClass="btn-login" value="Iniciar Sesión" action="#{loginUI.login}" style="background: #00723f !important; color: #ffffff !important; border: 1px solid #ffffff !important;" />
                </div>
            </h:form>
        </div>
    </div>
</h:body>

</html>
